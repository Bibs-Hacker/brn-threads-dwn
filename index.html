<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThreadSave — Threads Video Downloader</title>
<meta name="description" content="Download publicly accessible Threads videos with a simple paste-and-download workflow.">
<style>
:root{--bg:#06070b;--card:#0d1018;--line:#202637;--text:#f7f8fb;--muted:#9ca5b5;--accent:#fff;--glow:#8b5cf6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 15% 15%,#31206b 0,transparent 28%),radial-gradient(circle at 85% 80%,#0c5260 0,transparent 30%),var(--bg);overflow-x:hidden}
body:before{content:"";position:fixed;inset:-30%;background:conic-gradient(from 0deg,transparent,#8b5cf622,transparent,#22d3ee18,transparent);filter:blur(60px);animation:spin 18s linear infinite;pointer-events:none}@keyframes spin{to{transform:rotate(360deg)}}
.wrap{position:relative;z-index:1;width:min(960px,92vw);margin:auto;padding:70px 0}.badge{display:inline-flex;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#ffffff08;color:#cdd4e2;font-size:13px}.hero{text-align:center}.hero h1{font-size:clamp(42px,8vw,84px);line-height:.95;margin:22px 0 18px;letter-spacing:-.07em}.hero h1 span{background:linear-gradient(90deg,#fff,#a78bfa,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:620px;margin:0 auto;color:var(--muted);font-size:18px;line-height:1.6}.box{margin:40px auto 0;max-width:760px;padding:12px;border:1px solid #ffffff14;border-radius:24px;background:#090b11cc;backdrop-filter:blur(18px);box-shadow:0 30px 100px #0008}.row{display:flex;gap:10px}.input{flex:1;min-width:0;background:#111522;border:1px solid var(--line);color:var(--text);padding:18px;border-radius:16px;outline:none;font-size:16px}.input:focus{border-color:#8b5cf6}.btn{border:0;border-radius:16px;padding:0 24px;background:#fff;color:#08090d;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.status{padding:16px 6px 4px;color:var(--muted);min-height:28px}.result{margin-top:24px;display:grid;gap:18px}.video-card{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--card)}video{display:block;width:100%;max-height:560px;background:#000}.actions{padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.download{display:inline-flex;text-decoration:none;color:#090a0e;background:#fff;padding:12px 18px;border-radius:12px;font-weight:800}.note{font-size:12px;color:#7f899c;line-height:1.5;margin-top:30px;text-align:center}.error{color:#fda4af}.success{color:#86efac}@media(max-width:650px){.wrap{padding:40px 0}.row{flex-direction:column}.btn{height:54px}.hero h1{font-size:54px}}
</style>
</head>
<body><main class="wrap">
<section class="hero"><span class="badge">🚀 TEAM NASA MVP</span><h1>Thread<span>Save</span></h1><p>Paste a public Threads post. Preview the video. Download it cleanly.</p></section>
<section class="box"><div class="row"><input id="url" class="input" autocomplete="off" placeholder="https://www.threads.com/@user/post/..."/><button id="go" class="btn">Analyze</button></div><div id="status" class="status"></div><div id="result" class="result"></div></section>
<p class="note">For publicly accessible content only. This MVP does not attempt to access private posts or bypass authentication.</p>
</main>
<script>
const $=s=>document.querySelector(s), input=$('#url'), go=$('#go'), status=$('#status'), result=$('#result');
function setStatus(t,c=''){status.textContent=t;status.className='status '+c}
go.onclick=async()=>{const url=input.value.trim();result.innerHTML='';if(!url)return setStatus('Paste a Threads URL first.','error');go.disabled=true;setStatus('Analyzing Threads post…');try{const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not analyze that post.');setStatus(`Found ${d.videos.length} video${d.videos.length===1?'':'s'}.`,'success');d.videos.forEach(v=>{const card=document.createElement('article');card.className='video-card';card.innerHTML=`<video controls playsinline preload="metadata" src="${v.url}"></video><div class="actions"><span>Video ${v.id}</span><a class="download" href="/api/download?url=${encodeURIComponent(v.url)}">Download MP4</a></div>`;result.appendChild(card)})}catch(e){setStatus(e.message,'error')}finally{go.disabled=false}};
input.addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});
</script></body></html>
